services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hestia
      POSTGRES_PASSWORD: hestia
      POSTGRES_DB: hestia
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hestia -d hestia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
